[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-response-theory"
version = "0.1.0"
description = "Rubric Response Theory rewards for rubric-based reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "transformers>=4.45",
]

[project.optional-dependencies]
pipeline = [
    "huggingface-hub>=0.24",
    "openai>=1.68",
    "pandas>=2.0",
    "pyarrow>=14",
    "tqdm>=4.66",
]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
rrt-build-cache = "build_rollout_cache:main"
rrt-fit-rpn = "fit_rpn:main"
rrt-evaluate = "evaluate:main"
rrt-prepare-rubrichub = "data_prep.convert_rubrichub:main"
rrt-prepare-rar-science = "data_prep.convert_rar_science:main"
rrt-prepare-rubricbench = "data_prep.convert_rubricbench:main"

[tool.setuptools]
py-modules = ["build_rollout_cache", "evaluate", "fit_rpn", "reward"]

[tool.setuptools.packages.find]
include = ["core*", "data_prep*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
